version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: home_ai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home_ai_agent
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - CONFIG_PATH=/app/config/config.yaml
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
